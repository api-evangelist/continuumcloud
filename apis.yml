aid: continuumcloud
name: ContinuumCloud
description: >-
  ContinuumCloud is a Tampa, Florida-based provider of cloud software purpose-built for behavioral
  health and human services organizations. Its integrated suite spans three products: Welligent, an
  electronic health record (EHR) platform for caseload management, scheduling, clinical documentation
  and revenue-cycle management; DATIS e3, a unified human capital management (HCM) and payroll system
  covering recruiting, onboarding, timekeeping, talent management and workforce analytics; and CaredFor,
  a patient-engagement platform that builds online communities connecting clients, alumni and families.
  Formerly known as Behavioral Holdings and founded in 2020, the company draws on 25+ years of domain
  focus and is backed by Battery Ventures. ContinuumCloud does not publish a public developer API,
  OpenAPI definition, SDKs, or MCP server at this time; this profile captures its company identity and
  public web properties for the API Evangelist network.
